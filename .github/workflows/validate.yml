name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/sync-x-to-obsidian.js
      - run: bash -n scripts/x2obsidian
      - run: node --check scripts/desktop-capture.js
      - run: node --test tests/*.test.js
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/verify-macos.sh
